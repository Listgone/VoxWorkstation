<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob: http://127.0.0.1:*; connect-src http://127.0.0.1:* http://localhost:*; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>VoxWorkstation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 水墨山水背景层（仅「黑白水墨」主题显示） -->
<div class="ink-bg" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <defs>
      <filter id="inkEdge" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.019" numOctaves="3" seed="12" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="inkEdgeSoft" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.016 0.026" numOctaves="2" seed="5" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="1.2"/>
      </filter>
      <filter id="cloudBlur"><feGaussianBlur stdDeviation="26"/></filter>
      <linearGradient id="inkFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".8"/>
      </linearGradient>
    </defs>
    <g filter="url(#inkEdgeSoft)" opacity=".13" style="animation:drift-far 150s ease-in-out infinite alternate">
      <path fill="#161614" d="M-100,640 L60,520 L150,566 L280,432 L400,520 L520,392 L660,500 L800,430 L930,520 L1060,436 L1200,520 L1330,452 L1470,540 L1600,470 L1700,540 L1700,900 L-100,900 Z"/>
    </g>
    <g filter="url(#inkEdge)" opacity=".24" style="animation:drift-mid 110s ease-in-out infinite alternate">
      <path fill="#161614" d="M-100,760 L40,600 L170,690 L300,520 L420,640 L520,560 L640,700 L780,600 L900,720 L1040,620 L1180,730 L1320,650 L1460,760 L1600,690 L1700,760 L1700,900 L-100,900 Z"/>
    </g>
    <g filter="url(#inkEdge)" opacity=".30" style="animation:drift-far 130s ease-in-out infinite alternate-reverse">
      <path fill="#161614" d="M-100,830 L120,790 L300,820 L470,780 L650,818 L840,786 L1020,824 L1210,792 L1400,828 L1600,800 L1700,820 L1700,900 L-100,900 Z"/>
    </g>
    <g filter="url(#cloudBlur)">
      <ellipse cx="330" cy="640" rx="290" ry="46" fill="#ffffff" opacity=".75"
        style="animation:drift-cloud 70s ease-in-out infinite alternate, cloudPuff 13s ease-in-out infinite"/>
      <ellipse cx="880" cy="700" rx="340" ry="40" fill="#ffffff" opacity=".7"
        style="animation:drift-cloud 88s ease-in-out infinite alternate-reverse, cloudPuff 17s ease-in-out infinite"/>
      <ellipse cx="1330" cy="650" rx="250" ry="38" fill="#ffffff" opacity=".65"
        style="animation:drift-cloud 76s ease-in-out infinite alternate, cloudPuff 15s ease-in-out infinite"/>
    </g>
    <rect x="0" y="0" width="1600" height="900" fill="url(#inkFade)" opacity=".55"/>
  </svg>
  <div class="specks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div class="bloom" id="ink-bloom" aria-hidden="true"></div>

<div id="titlebar">
  <div class="titlebar-drag">
    <span class="titlebar-logo"><span class="logo-dot"></span> VoxWorkstation</span>
    <span class="crumb" id="crumb"></span>
  </div>
  <div class="titlebar-actions">
    <button id="btn-theme" title="切换主题（明亮现代 / 黑白水墨）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    <button id="btn-min" title="最小化"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button id="btn-max" title="最大化"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg></button>
    <button id="btn-close" title="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
</div>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <p id="loading-text">正在启动 VoxCPM2 引擎...</p>
  <div class="loading-progress"></div>
  <div id="loading-elapsed">已等待 0 秒</div>
  <div id="loading-log"></div>
  <button class="btn btn-secondary" id="loading-retry">重试启动</button>
</div>

<div id="app-shell" style="display:none">
  <aside id="sidebar">
    <button class="nav-item top" data-page="dash">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>仪表板</span></button>

    <div class="nav-group">项目</div>
    <button class="nav-item" data-page="projects">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>项目管理</span><span class="badge" id="nav-proj-count"></span></button>
    <button class="nav-item" data-page="episodes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>集管理</span><span class="badge" id="nav-ep-count"></span></button>

    <div class="nav-group">工作流</div>
    <button class="nav-item" data-page="text">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <span>文本处理</span></button>
    <button class="nav-item" data-page="dub">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span>配音</span><span class="badge" id="nav-line-count"></span></button>
    <button class="nav-item" data-page="export">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>导出</span></button>

    <div class="nav-group">资产</div>
    <button class="nav-item" data-page="voices">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>音色库</span><span class="badge" id="nav-voice-count"></span></button>

    <div class="sidebar-foot">
      <button class="nav-item" data-page="settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span></button>
      <div class="sidebar-engine">
        <span>VoxCPM2 引擎</span><span id="side-status">启动中…</span>
      </div>
    </div>
  </aside>

  <main id="main-area">
    <div class="page-scroll" id="page-scroll">
      <section id="page-dash" class="page"></section>
      <section id="page-projects" class="page"></section>
      <section id="page-project-settings" class="page"></section>
      <section id="page-episodes" class="page"></section>
      <section id="page-text" class="page"></section>
      <section id="page-dub" class="page"></section>
      <section id="page-export" class="page"></section>
      <section id="page-voices" class="page"></section>
      <section id="page-settings" class="page"></section>
    </div>
  </main>
</div>

<footer id="status-bar">
  <span id="status-text">就绪</span>
  <span id="status-mid" class="text-muted"></span>
  <span class="status-right">
    <span id="status-ai" class="text-muted"></span>
    <span id="gpu-indicator" title="GPU"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span id="gpu-text">--</span></span>
  </span>
</footer>

<div id="modal-host"></div>

<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/components/toast.js"></script>
<script src="js/components/player.js"></script>
<script src="js/components/gpu.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/projects.js"></script>
<script src="js/pages/project-settings.js"></script>
<script src="js/pages/episodes.js"></script>
<script src="js/pages/text.js"></script>
<script src="js/pages/dub.js"></script>
<script src="js/pages/export.js"></script>
<script src="js/pages/voices.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
